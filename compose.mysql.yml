services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: local-root-only
      MYSQL_DATABASE: practice_lab
      MYSQL_USER: lab
      MYSQL_PASSWORD: lab
    ports:
      - "127.0.0.1:3308:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -ulab -plab --silent"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - mysql_lab_data:/var/lib/mysql

volumes:
  mysql_lab_data:
